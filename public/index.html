<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iray</title>
<meta name="theme-color" content="#151225">
<meta name="description" content="Um espaço privado a dois, sempre à mão.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#151225;
    --ink-2:#1c1830;
    --ink-3:#241f3c;
    --gold:#e3a869;
    --gold-soft:#e3a86933;
    --rose:#d98b8b;
    --paper:#f4ecdd;
    --paper-dim:#c9c0af;
    --line:#e3a86922;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1px 1px at 20px 30px, var(--gold-soft) 0, transparent 40%),
      radial-gradient(1px 1px at 140px 90px, var(--gold-soft) 0, transparent 40%),
      radial-gradient(1px 1px at 260px 40px, var(--gold-soft) 0, transparent 40%),
      radial-gradient(1px 1px at 90px 180px, var(--gold-soft) 0, transparent 40%),
      radial-gradient(1px 1px at 320px 220px, var(--gold-soft) 0, transparent 40%),
      var(--ink);
    background-attachment:fixed;
    color:var(--paper);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .display{font-family:'Cormorant Garamond',serif;}

  /* ---------- LOGIN ---------- */
  #login{
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
    text-align:center;
    gap:6px;
  }
  .seal{
    width:56px;height:56px;border-radius:50%;
    background:var(--gold);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink); font-family:'Cormorant Garamond',serif; font-weight:600; font-size:26px;
    margin-bottom:18px;
    box-shadow:0 0 0 1px var(--ink), 0 0 30px 4px #e3a86944;
  }
  #login h1{
    font-size:32px; font-weight:600; margin:0 0 4px;
    letter-spacing:0.02em;
  }
  #login p.tag{
    color:var(--paper-dim); font-size:14px; margin:0 0 36px;
    letter-spacing:0.03em;
  }
  .perfis{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-bottom:22px;}
  .perfil-btn{
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--paper);
    border-radius:16px;
    padding:18px 26px;
    font-family:'Cormorant Garamond',serif;
    font-size:20px;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
    min-width:120px;
  }
  .perfil-btn:hover{border-color:var(--gold); transform:translateY(-2px);}
  .perfil-btn.activo{border-color:var(--gold); background:var(--ink-3);}

  #pin-wrap{display:none; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:280px;}
  #pin-wrap.visivel{display:flex;}
  #pin{
    width:100%;
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--paper);
    border-radius:12px;
    padding:14px 16px;
    font-size:20px;
    letter-spacing:0.4em;
    text-align:center;
    outline:none;
  }
  #pin:focus{border-color:var(--gold);}
  #entrar{
    width:100%;
    background:var(--gold);
    color:var(--ink);
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    letter-spacing:0.02em;
  }
  #erro-login{color:var(--rose); font-size:13px; min-height:18px;}

  /* ---------- CHAT ---------- */
  #chat{
    display:none;
    height:100dvh;
    flex-direction:column;
  }
  #chat.visivel{display:flex;}
  header.topo{
    display:flex; align-items:center; gap:12px;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) 18px 14px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  header.topo .seal{width:34px;height:34px;font-size:16px;margin:0; position:relative;}
  header.topo .seal .ponto{
    position:absolute; bottom:-1px; right:-1px; width:10px; height:10px;
    border-radius:50%; background:#5a5470; border:2px solid var(--ink);
  }
  header.topo .seal .ponto.online{background:#4fd17a;}
  header.topo .titulo{font-family:'Cormorant Garamond',serif; font-size:20px; flex:1;}
  header.topo .titulo small{display:block; font-size:11px; color:var(--paper-dim); font-family:'Inter'; letter-spacing:0.04em;}
  header.topo .titulo small.pt-caminho{color:#8ec7e0;}
  header.topo .titulo small.pt-ocupado{color:var(--rose);}
  header.topo .titulo small.pt-dormir{color:#a89ad1;}
  header.topo .titulo small.pt-disponivel, header.topo .titulo small.pt-online{color:#8fcf9f;}
  #sair{background:none;border:none;color:var(--paper-dim); font-size:13px; cursor:pointer;}

  #barra-acoes{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    padding:10px 14px; border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  #meu-status{
    background:var(--ink-2); border:1px solid var(--line); color:var(--paper-dim);
    border-radius:20px; padding:7px 12px; font-size:12px; font-family:'Inter';
  }
  #btn-pensando{
    background:var(--gold-soft); border:1px solid var(--gold); color:var(--gold);
    border-radius:20px; padding:7px 14px; font-size:12px; cursor:pointer;
    font-family:'Inter'; font-weight:500; white-space:nowrap;
  }
  #btn-pensando:active{transform:scale(0.97);}

  #mensagens{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .dia-div{
    text-align:center; color:var(--paper-dim); font-size:11px;
    letter-spacing:0.08em; text-transform:uppercase;
    margin:18px 0 10px; position:relative;
  }
  .msg{
    max-width:78%;
    padding:10px 14px;
    border-radius:16px;
    margin:5px 0;
    font-size:15px;
    line-height:1.4;
    animation:surgir .25s ease;
    word-wrap:break-word;
  }
  @keyframes surgir{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .msg .nome{
    font-family:'Cormorant Garamond',serif; font-size:12px; font-weight:600;
    color:var(--gold); margin-bottom:2px; letter-spacing:0.02em;
  }
  .msg.eu{ align-self:flex-end; background:var(--ink-3); border:1px solid var(--line); border-bottom-right-radius:4px;}
  .msg.outra{ align-self:flex-start; background:var(--ink-2); border:1px solid var(--line); border-bottom-left-radius:4px;}
  .msg.iray{ align-self:flex-start; background:transparent; border:1px solid var(--gold-soft); border-bottom-left-radius:4px;}
  .msg.carinho{ background:linear-gradient(135deg, var(--gold-soft), transparent); border-color:var(--gold); align-self:center; text-align:center; max-width:88%;}
  .msg.eu .nome{display:none;}
  .hora{font-size:10px; color:var(--paper-dim); margin-top:3px; text-align:right; display:flex; justify-content:flex-end; align-items:center; gap:4px;}
  .tick{color:var(--paper-dim); letter-spacing:-2px;}
  .tick.lida{color:#4fc3f7;}
  .msg audio{width:100%; margin-top:2px; filter:invert(0.9) hue-rotate(180deg);}

  #digitando{
    padding:0 16px 6px; font-size:12px; color:var(--paper-dim); font-style:italic;
    min-height:18px;
  }

  form#form-msg{
    display:flex; gap:10px; align-items:center;
    padding:12px 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
    border-top:1px solid var(--line);
    flex-shrink:0;
  }
  #texto{
    flex:1;
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--paper);
    border-radius:22px;
    padding:12px 16px;
    font-size:15px;
    outline:none;
    font-family:'Inter';
  }
  #texto:focus{border-color:var(--gold);}
  #enviar{
    background:var(--gold);
    border:none;
    color:var(--ink);
    width:42px;height:42px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  #gravar{
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--paper);
    width:42px;height:42px;
    border-radius:50%;
    font-size:17px;
    cursor:pointer;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  #gravar.a-gravar{background:var(--rose); border-color:var(--rose); color:var(--ink); animation:pulsar 1s infinite;}
  @keyframes pulsar{ 0%,100%{opacity:1;} 50%{opacity:0.55;} }
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--ink-3); border-radius:3px;}
</style>
</head>
<body>

<div id="login">
  <div class="seal">I</div>
  <h1 class="display">Iray</h1>
  <p class="tag">um espaço só vosso, sem mais ninguém a ler</p>
  <div id="pin-wrap" class="visivel">
    <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off">
    <button id="entrar">Entrar</button>
    <div id="erro-login"></div>
  </div>
</div>

<div id="chat">
  <header class="topo">
    <div class="seal">I<span class="ponto" id="ponto-online"></span></div>
    <div class="titulo">Iray<small id="sub-titulo">a ligar...</small></div>
    <button id="sair">sair</button>
  </header>
  <div id="barra-acoes">
    <select id="meu-status">
      <option value="disponivel">🟢 Disponível</option>
      <option value="caminho">🚶 A caminho</option>
      <option value="ocupado">💼 Ocupado/a</option>
      <option value="dormir">😴 A dormir</option>
    </select>
    <button id="btn-pensando" type="button">💭 A pensar em ti</button>
  </div>
  <div id="mensagens"></div>
  <div id="digitando"></div>
  <form id="form-msg">
    <input id="texto" placeholder="Escreve algo... (chama 'iray' para falar com ele)" autocomplete="off">
    <button id="gravar" type="button">🎙️</button>
    <button id="enviar" type="submit">↑</button>
  </form>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}

const estado = { token: localStorage.getItem('iray_token'), nome: localStorage.getItem('iray_nome'), id: localStorage.getItem('iray_id') };
let ws = null;
let companheiro = null; // { id, name } — a outra pessoa

const $ = sel => document.querySelector(sel);
const elLogin = $('#login'), elChat = $('#chat');
const elPin = $('#pin'), elErro = $('#erro-login'), elMensagens = $('#mensagens'), elTexto = $('#texto');
const elDigitando = $('#digitando'), elSub = $('#sub-titulo');
const elMeuStatus = $('#meu-status'), elBtnPensando = $('#btn-pensando'), elGravar = $('#gravar');
const elPontoOnline = $('#ponto-online');

let ultimoEstadoPresenca = null, ultimoEstadoOnline = null;

elPin.focus();

$('#entrar').onclick = async (e) => {
  e.preventDefault();
  elErro.textContent = '';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: elPin.value })
    });
    const data = await resp.json();
    if (!resp.ok) { elErro.textContent = data.erro || 'Erro ao entrar.'; elPin.value = ''; elPin.focus(); return; }
    estado.token = data.token; estado.nome = data.name; estado.id = data.id;
    localStorage.setItem('iray_token', data.token);
    localStorage.setItem('iray_nome', data.name);
    localStorage.setItem('iray_id', data.id);
    entrarNoChat();
  } catch { elErro.textContent = 'Não consegui ligar ao servidor.'; }
};
elPin.addEventListener('keydown', e => { if (e.key === 'Enter') $('#entrar').click(); });

$('#sair').onclick = () => {
  localStorage.clear();
  location.reload();
};

function formatarHora(ts) {
  return new Date(ts).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
}
function formatarDia(ts) {
  const d = new Date(ts);
  const hoje = new Date();
  const ontem = new Date(Date.now() - 86400000);
  const mesmoDia = (a,b) => a.toDateString() === b.toDateString();
  if (mesmoDia(d, hoje)) return 'Hoje';
  if (mesmoDia(d, ontem)) return 'Ontem';
  return d.toLocaleDateString('pt-PT', { day: 'numeric', month: 'long' });
}

function marcarTick(estadoMsg) {
  if (estadoMsg === 'lida') return '<span class="tick lida">✓✓</span>';
  if (estadoMsg === 'entregue') return '<span class="tick">✓✓</span>';
  return '<span class="tick">✓</span>';
}

let ultimoDia = null;
function renderMensagem(m) {
  const dia = formatarDia(m.ts);
  if (dia !== ultimoDia) {
    const div = document.createElement('div');
    div.className = 'dia-div';
    div.textContent = dia;
    elMensagens.appendChild(div);
    ultimoDia = dia;
  }
  const bolha = document.createElement('div');
  const ehMinha = m.autor === estado.id;
  const classe = m.autor === 'iray' ? 'iray' : (ehMinha ? 'eu' : 'outra');
  bolha.className = `msg ${classe}${m.carinho ? ' carinho' : ''}`;
  bolha.dataset.id = m.id;
  const conteudo = m.audioUrl
    ? `<audio controls src="${m.audioUrl}"></audio>`
    : escapeHtml(m.texto || '');
  const tick = ehMinha ? marcarTick(m.estado) : '';
  bolha.innerHTML = `<div class="nome">${m.nome}</div>${conteudo}<div class="hora">${formatarHora(m.ts)}${tick}</div>`;
  elMensagens.appendChild(bolha);
  elMensagens.scrollTop = elMensagens.scrollHeight;
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function entrarNoChat() {
  elLogin.style.display = 'none';
  elChat.classList.add('visivel');
  const historico = await fetch('/api/mensagens', { headers: { 'x-token': estado.token } }).then(r => r.json());
  ultimoDia = null;
  elMensagens.innerHTML = '';
  historico.forEach(renderMensagem);
  companheiro = await fetch('/api/companheiro', { headers: { 'x-token': estado.token } }).then(r => r.json()).catch(() => null);
  ligarWebSocket();
  activarPushReal();
}

function urlBase64ToUint8Array(base64) {
  const padding = '='.repeat((4 - base64.length % 4) % 4);
  const base64safe = (base64 + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64safe);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

// Notificações push a sério — funcionam mesmo com a app fechada. Pede
// permissão, subscreve o telemóvel e envia essa subscrição ao servidor.
async function activarPushReal() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    if (Notification.permission === 'default') await Notification.requestPermission();
    if (Notification.permission !== 'granted') return;

    const registo = await navigator.serviceWorker.ready;
    let subscription = await registo.pushManager.getSubscription();
    if (!subscription) {
      const { chave } = await fetch('/api/push/chave-publica').then(r => r.json());
      subscription = await registo.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(chave)
      });
    }
    await fetch('/api/push/subscrever', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token': estado.token },
      body: JSON.stringify(subscription)
    });
  } catch (err) {
    console.warn('Não consegui activar notificações push:', err);
  }
}

const ROTULOS_STATUS = { disponivel: '🟢 disponível', caminho: '🚶 a caminho', ocupado: '💼 ocupado/a', dormir: '😴 a dormir' };

function formatarUltimaVez(ts) {
  if (!ts) return 'offline';
  const d = new Date(ts);
  const dia = formatarDia(ts);
  const hora = d.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
  return dia === 'Hoje' ? `visto às ${hora}` : `visto ${dia.toLowerCase()} às ${hora}`;
}

function actualizarCabecalho() {
  if (!companheiro || !ultimoEstadoOnline) return;
  const dele = ultimoEstadoOnline.find(p => p.id === companheiro.id);
  const statusDele = ultimoEstadoPresenca?.find(p => p.id === companheiro.id)?.status;
  elPontoOnline.classList.toggle('online', !!dele?.online);
  if (dele?.online) {
    if (statusDele && statusDele !== 'disponivel') {
      elSub.textContent = ROTULOS_STATUS[statusDele] || statusDele;
      elSub.className = `pt-${statusDele}`;
    } else {
      elSub.textContent = 'em linha';
      elSub.className = 'pt-online';
    }
  } else {
    elSub.textContent = formatarUltimaVez(dele?.ultimaVez);
    elSub.className = '';
  }
  const meuStatus = ultimoEstadoPresenca?.find(p => p.id === estado.id)?.status;
  if (meuStatus) elMeuStatus.value = meuStatus;
}

function actualizarTicks(ids, novoEstado) {
  ids.forEach(id => {
    const bolha = elMensagens.querySelector(`.msg[data-id="${id}"]`);
    if (!bolha) return;
    const hora = bolha.querySelector('.hora');
    const antigoTick = hora.querySelector('.tick');
    if (antigoTick) antigoTick.outerHTML = marcarTick(novoEstado);
  });
}

// Manda ao servidor quais mensagens da outra pessoa já foram vistas —
// chamado ao abrir o chat e sempre que chegam mensagens novas em foco.
function marcarComoLidas() {
  if (ws && ws.readyState === 1 && !document.hidden && document.hasFocus()) {
    ws.send(JSON.stringify({ tipo: 'lido' }));
  }
}
document.addEventListener('visibilitychange', marcarComoLidas);
window.addEventListener('focus', marcarComoLidas);

function mostrarIndicador(texto) {
  elDigitando.textContent = texto;
}

function ligarWebSocket() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${estado.token}`);
  ws.onopen = () => { marcarComoLidas(); };
  ws.onclose = () => { setTimeout(ligarWebSocket, 3000); };
  ws.onmessage = (ev) => {
    const data = JSON.parse(ev.data);
    if (data.tipo === 'mensagem') {
      renderMensagem(data.msg);
      elDigitando.textContent = '';
      if (data.msg.autor !== estado.id) marcarComoLidas();
    }
    if (data.tipo === 'digitando') { elDigitando.textContent = 'Iray está a escrever...'; }
    if (data.tipo === 'escrevendo' && data.paraId === estado.id) {
      mostrarIndicador(data.activo ? `${data.de} está a escrever...` : '');
    }
    if (data.tipo === 'gravando' && data.paraId === estado.id) {
      mostrarIndicador(data.activo ? `${data.de} está a gravar um áudio 🎙️` : '');
    }
    if (data.tipo === 'presenca') { ultimoEstadoPresenca = data.estado; actualizarCabecalho(); }
    if (data.tipo === 'online') { ultimoEstadoOnline = data.estado; actualizarCabecalho(); }
    if (data.tipo === 'estado') { actualizarTicks(data.ids, data.estado); }
    if (data.tipo === 'notificar' && data.paraId === estado.id) { mostrarNotificacao(data.titulo, data.corpo); }
  };
}

function mostrarNotificacao(titulo, corpo) {
  // Só faz sentido notificar quando a app não está em primeiro plano —
  // se a pessoa já está a olhar para o chat, vê a mensagem na hora.
  if (document.hidden || !document.hasFocus()) {
    if ('Notification' in window && Notification.permission === 'granted') {
      try { new Notification(titulo, { body: corpo, icon: '/icons/icon-192.png', tag: 'iray-chat' }); } catch {}
    }
  }
}

elMeuStatus.onchange = () => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ tipo: 'status', valor: elMeuStatus.value }));
};

elBtnPensando.onclick = () => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ tipo: 'pensando' }));
};

$('#form-msg').onsubmit = (e) => {
  e.preventDefault();
  const texto = elTexto.value.trim();
  if (!texto || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ texto }));
  elTexto.value = '';
  pararDeEscrever();
};

// --- "A escrever..." — avisa a outra pessoa enquanto se digita, e pára
// sozinho ao fim de 3s sem toques ou ao enviar/apagar tudo. ---
let aEscrever = false, timeoutEscrever = null;
function pararDeEscrever() {
  if (aEscrever && ws && ws.readyState === 1) ws.send(JSON.stringify({ tipo: 'escrevendo', activo: false }));
  aEscrever = false;
  clearTimeout(timeoutEscrever);
}
elTexto.addEventListener('input', () => {
  if (!ws || ws.readyState !== 1) return;
  if (!elTexto.value.trim()) { pararDeEscrever(); return; }
  if (!aEscrever) { ws.send(JSON.stringify({ tipo: 'escrevendo', activo: true })); aEscrever = true; }
  clearTimeout(timeoutEscrever);
  timeoutEscrever = setTimeout(pararDeEscrever, 3000);
});

// --- Gravação de áudio ---
let gravador = null, pedacos = [], aGravar = false;

async function alternarGravacao() {
  if (aGravar) { gravador.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    pedacos = [];
    gravador = new MediaRecorder(stream);
    gravador.ondataavailable = (e) => { if (e.data.size) pedacos.push(e.data); };
    gravador.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      aGravar = false;
      elGravar.classList.remove('a-gravar');
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ tipo: 'gravando', activo: false }));
      const blob = new Blob(pedacos, { type: 'audio/webm' });
      if (blob.size < 500) return; // gravação demasiado curta / cancelada
      try {
        const resp = await fetch('/api/audio', {
          method: 'POST',
          headers: { 'x-token': estado.token, 'Content-Type': 'audio/webm' },
          body: blob
        });
        const data = await resp.json();
        if (resp.ok && ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ tipo: 'audio', url: data.url }));
        }
      } catch { elErro.textContent = ''; }
    };
    gravador.start();
    aGravar = true;
    elGravar.classList.add('a-gravar');
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ tipo: 'gravando', activo: true }));
  } catch {
    alert('Não consegui aceder ao microfone. Verifica as permissões do browser.');
  }
}
elGravar.onclick = alternarGravacao;

if (estado.token) entrarNoChat();
</script>
</body>
</html>
